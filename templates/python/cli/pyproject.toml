[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cli-validator"
version = "0.1.0"
description = "CLI 模板项目：配置文件校验器"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
cli-validator = "cli_validator.core:main"

[tool.hatch.build.targets.wheel]
packages = ["cli_validator"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S301"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
