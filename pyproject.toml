[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dev-platform"
version = "0.1.0"
description = "AI 自主软件研发平台：多角色 Agent 研发控制平台（平台自身）"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

# 包随 Phase 1+ 逐步实现：仅登记含 __init__.py 的平台包，
# 避免 setuptools 自动发现把 apps/config/skills 等目录误认为 Python 包。
[tool.setuptools.packages.find]
include = ["core*", "adapters*", "apps*"]
namespaces = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["runtime", "examples", "templates"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["scripts", "core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
